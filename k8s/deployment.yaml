apiVersion: apps/v1
kind: Deployment
metadata:
  name: football-api
spec:
  replicas: 1 # how many
  selector:
    matchLabels:
      app: football-api
  template:
    metadata:
      labels:
        app: football-api
    spec:
      containers:
        - name: football-api
          image: ghcr.io/markapaa/football-api:latest
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: football-api
spec:
  selector:
    app: football-api
  ports:
    - port: 80
      targetPort: 8000